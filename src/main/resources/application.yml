spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

strava:
  access-token: ${STRAVA_ACCESS_TOKEN}

server:
  port: 8080
